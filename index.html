<h1>頻道自動發片工具</h1>
<p>這是一個<strong>個人使用</strong>的小工具，只用來管理頻道主自己的 YouTube 頻道：</p>
<ul>
  <li>問號研究所：一分鐘冷知識短片</li>
  <li>迅雷新聞：每天一則 AI／科技新聞短片</li>
</ul>
<p>工具在頻道主自己的電腦上執行，透過 YouTube 官方 API 上傳頻道主自己製作的影片，並讀取頻道的觀看數據，用來改進內容。這個工具不對外提供服務，也不會存取其他人的帳號。</p>
